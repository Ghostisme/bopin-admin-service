spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    # characterEncoding 必须使用 Java 支持的 UTF-8；MySQL 服务器端仍使用 utf8mb4。
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/bopin?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:bopin}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${MYSQL_INIT_MODE:always}
      schema-locations: classpath:schema-mysql.sql
      # 正式 MySQL 默认不写入演示数据。需要本地演示时显式设置：
      # MYSQL_DATA_LOCATIONS=classpath:data-mysql.sql
      data-locations: ${MYSQL_DATA_LOCATIONS:classpath:data-mysql-empty.sql}
      encoding: UTF-8
