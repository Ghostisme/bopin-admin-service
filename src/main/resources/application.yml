server:
  port: 8080
spring:
  application:
    name: bopin-admin-server
  datasource:
    url: jdbc:h2:file:./data/bopin;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
management:
  endpoints:
    web:
      exposure:
        include: health,info
